services:
  fgxp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fgxp-server
    restart: always
    ports:
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./configs/server.example.yaml:/etc/fgxp/server.yaml:ro
      - ./cert.pem:/etc/fgxp/cert.pem:ro
      - ./key.pem:/etc/fgxp/key.pem:ro
    environment:
      - LOG_LEVEL=info
    command: ["--config", "/etc/fgxp/server.yaml"]

  fgxp-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fgxp-client
    restart: always
    entrypoint: ["/usr/local/bin/fgxp-client"]
    volumes:
      - ./configs/client.example.yaml:/etc/fgxp/client.yaml:ro
    environment:
      - LOG_LEVEL=info
    command: ["--server", "fgxp-server:443", "--psk", "CHANGE_ME_PSK", "--sni", "localhost"]
    depends_on:
      - fgxp-server
